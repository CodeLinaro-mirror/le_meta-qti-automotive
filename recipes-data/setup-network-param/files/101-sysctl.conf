# Increase socket buffer sizes
net.core.rmem_max = 33554432
net.core.wmem_max = 262144
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
net.core.optmem_max = 25165824

# TCP and UDP memory settings
net.ipv4.tcp_mem = 8388608 1048576 16777216
net.ipv4.udp_mem = 786432 1048576 16777216
net.ipv4.tcp_rmem = 8192 87380 16777216
net.ipv4.tcp_wmem = 8192 87380 16777216

# TCP settings
net.ipv4.tcp_timestamps = 0

# Connection queue settings
net.core.somaxconn = 10000
net.core.netdev_max_backlog = 10000

# Fragmentation thresholds and timers
net.ipv4.ipfrag_high_thresh = 50000000
net.ipv6.ip6frag_high_thresh = 50000000
net.ipv4.ipfrag_time = 2
net.ipv6.ip6frag_time = 2

# Static IPv6 address retainment
net.ipv6.conf.all.keep_addr_on_down = 1
net.ipv6.conf.default.keep_addr_on_down = 1
