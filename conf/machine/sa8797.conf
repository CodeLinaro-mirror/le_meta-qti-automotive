#@TYPE: Machine
#@NAME: sa8797
#@DESCRIPTION: Machine configuration for QTI sa8797

BASEMACHINE = "sa8797"
include conf/machine/include/sa8797.inc
#require conf/machine/qcom-sa8797.conf

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

RECOVERY_IMAGE = "0"

PREFERRED_PROVIDER_mkbootimg-native = "mkbootimg-gki-native"
PREFERRED_VERSION_mkbootimg-gki-native = "5.14"

EXTRA_IMAGEDEPENDS += "edk2"
CLANG_BIN="${SRC_DIR_ROOT}/prebuilts/clang/host/linux-x86/clang-r416183b/bin/"

KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "defconfig"
RH_KERNEL_NAME = "rh-fedora-kernel-6.9"

KERNEL_MACHINE_DTB = "\
    arch/arm64/boot/dts/qcom/sa8397p-qam-ride-mx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-qam-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-adp-star.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-qam-ride-mx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-qam-ride-sx.dtb \
"

KERNEL_CMD_PARAMS = "rw rootwait console=ttyMSM0,115200,n8 no_console_suspend=1 androidboot.hardware=qcom androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 earlycon=qcom_geni,0x884000 fips=0 notests nokaslr ignore_loglevel firmware_class.path=/firmware/vm/boot systemd.gpt_auto=0 cgroup.memory=nokmem,nosocket androidboot.slot_suffix=_a "
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('MACHINE_FEATURES', 'early-ramdisk-init', ' rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=0 ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=qcom_geni,0xa8c000', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"

KERNEL_IMAGETYPE = "Image"

OOT_DTBS = "\
    arch/arm64/boot/dts/qcom/sa8797p-overlay.dtbo \
    arch/arm64/boot/dts/qcom/sa8397p-overlay.dtbo \
"

EARLY_RAMDISK_KERNEL_MODULES = "\
    kernel-module-clk-qcom-${KERNEL_VERSION} \
    kernel-module-pinctrl-msm-${KERNEL_VERSION} \
    kernel-module-clk-rpmh-${KERNEL_VERSION} \
    kernel-module-cmd-db-${KERNEL_VERSION} \
    kernel-module-qcom-rpmh-${KERNEL_VERSION} \
    kernel-module-rpmhpd-${KERNEL_VERSION} \
    kernel-module-qcom-geni-se-${KERNEL_VERSION} \
    kernel-module-qcom-geni-serial-${KERNEL_VERSION} \
    kernel-module-icc-bcm-voter-${KERNEL_VERSION} \
    kernel-module-icc-rpmh-${KERNEL_VERSION} \
    kernel-module-qcom-rpmh-regulator-${KERNEL_VERSION} \
    kernel-module-phy-qcom-qmp-ufs-${KERNEL_VERSION} \
    kernel-module-ufs-qcom-${KERNEL_VERSION} \
    kernel-module-mbcache-${KERNEL_VERSION} \
    kernel-module-ext4-${KERNEL_VERSION} \
    kernel-module-jbd2-${KERNEL_VERSION} \
    kernel-module-governor-simpleondemand-${KERNEL_VERSION} \
    kernel-module-ufshcd-core-${KERNEL_VERSION} \
    kernel-module-ufshcd-pltfrm-${KERNEL_VERSION} \
    kernel-module-spmi-${KERNEL_VERSION} \
    kernel-module-regmap-spmi-${KERNEL_VERSION} \
    kernel-module-spmi-pmic-arb-${KERNEL_VERSION} \
    kernel-module-pinctrl-spmi-gpio-${KERNEL_VERSION} \
    kernel-module-pinctrl-spmi-mpp-${KERNEL_VERSION} \
    kernel-module-qcom-spmi-pmic-${KERNEL_VERSION} \
    kernel-module-nvmem-qcom-spmi-sdam-${KERNEL_VERSION} \
    kernel-module-marvell-${KERNEL_VERSION} \
"

RUSTVERSION = "1.75%"
