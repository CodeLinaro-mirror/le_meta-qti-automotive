#@TYPE: Machine
#@NAME: sa8797
#@DESCRIPTION: Machine configuration for QTI sa8797

BASEMACHINE = "sa8797"
include conf/machine/include/sa8797.inc
#require conf/machine/qcom-sa8797.conf

include conf/machine/include/tune-oryon-1.inc

RECOVERY_IMAGE = "0"

PREFERRED_PROVIDER_mkbootimg-native = "mkbootimg-gki-native"
PREFERRED_VERSION_mkbootimg-gki-native = "5.14"

EXTRA_IMAGEDEPENDS += "edk2"
CLANG_BIN="${SRC_DIR_ROOT}/prebuilts/clang/host/linux-x86/clang-r416183b/bin/"

KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "defconfig"
RH_KERNEL_NAME = "rh-fedora-kernel-6.9"
KERNEL_ARCH = "gen5auto"

KERNEL_CMD_PARAMS = "rw rootwait console=ttyMSM0,115200,n8 earlycon=qcom_geni,0x884000 firmware_class.path=/firmware/vm/boot systemd.gpt_auto=0 cgroup.memory=nokmem,nosocket qcom_scm.download_mode=1 page_owner=on "
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('MACHINE_FEATURES', 'early-ramdisk-init', ' rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=0 ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=qcom_geni,0xa8c000', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'page_owner=on', '', d)}"

KERNEL_IMAGETYPE = "Image"

KERNEL_MACHINE_DTB = "\
    arch/arm64/boot/dts/qcom/sa8397p-adp-star.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-non-safe-ivi-adp-star.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-non-safe-ivi-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-safe-ivi-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-ad-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-ab-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-non-safe-la-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-non-safe-multi-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-la-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8397p-multi-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-adp-star.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-non-safe-ivi-adp-star.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-adp-star-pcie-ep.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-qam-ride-sx-pcie-ep.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-non-safe-ivi-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-safe-ivi-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-ab-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-ad-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-multi-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-non-safe-la-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-non-safe-multi-gvm-ride-sx.dtb \
    arch/arm64/boot/dts/qcom/sa8797p-la-gvm-ride-sx.dtb \
"
OOT_DTBS = "\
    arch/arm64/boot/dts/qcom/sa8797p-overlay.dtbo \
    arch/arm64/boot/dts/qcom/sa8397p-overlay.dtbo \
"

EARLY_RAMDISK_KERNEL_MODULES = "\
    kernel-module-phy-qcom-qmp-ufs-${KERNEL_VERSION} \
    kernel-module-marvell-${KERNEL_VERSION} \
    kernel-module-ipv6-${KERNEL_VERSION} \
    kernel-module-kiumd-${KERNEL_VERSION} \
    kernel-module-iommu-iova-map-${KERNEL_VERSION} \
    kernel-module-scm-user-intf-${KERNEL_VERSION} \
    kernel-module-scm-user-intf-sec-${KERNEL_VERSION} \
    kernel-module-vfio-platform-base-${KERNEL_VERSION} \
    kernel-module-vfio-platform-${KERNEL_VERSION} \
    kernel-module-kiumd-kgsl-${KERNEL_VERSION} \
    kernel-module-vfio-iommu-qcom-${KERNEL_VERSION} \
    kernel-module-ipcc-shmem-test-module-${KERNEL_VERSION} \
    kernel-module-i2c-qcom-geni-${KERNEL_VERSION} \
    kernel-module-spidev-${KERNEL_VERSION} \
    kernel-module-qcom-dload-mode-${KERNEL_VERSION} \
    kernel-module-qcom-uscmi-${KERNEL_VERSION} \
    kernel-module-mhi-ep-net-${KERNEL_VERSION} \
    kernel-module-kryo-arm64-edac-${KERNEL_VERSION} \
    kernel-module-socinfo-${KERNEL_VERSION} \
"

RUSTVERSION = "1.75%"
