#@TYPE: Machine
#@NAME: sa8797dc-svm
#@DESCRIPTION: Machine configuration for QTI sa8797dc-svm

require conf/machine/sa8797dc.conf

EXTRA_IMAGEDEPENDS:remove = "edk2"
MACHINE_FEATURES:append = "svm"

CLOUDAI_SVM_BUILD="1"

KERNEL_MACHINE_DTB = " \
        arch/arm64/boot/dts/qcom/sa8797p-gunyah-vm-dc.dtb \
"

OOT_DTBS = " \
        arch/arm64/boot/dts/qcom/sa8797p-gunyah-vm-dc-overlay.dtbo \
"

DTB_OFFSET = "0x9700000"

KERNEL_CMD_PARAMS = "nosoftlockup console=hvc0,115200n8 qcom_geni_serial.con_enabled=1 androidboot.first_stage_console=1"

# GVM uses hvc0 (virtio console) as its console, not the physical ttyMSM0 from the parent conf
SERIAL_CONSOLES = "115200;hvc0"
