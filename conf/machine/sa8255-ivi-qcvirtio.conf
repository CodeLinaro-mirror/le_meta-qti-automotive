#@TYPE: Machine
#@NAME: sa8255-ivi-qcvirtio
#@DESCRIPTION: Machine configuration for QTI sa8255-ivi with qcvirtio support

include conf/machine/sa8255-ivi.conf

MACHINEOVERRIDES =. ":sa8255-ivi-qcvirtio:"

OOT_VM_DTBOS_AGL = "sa8255p-ride/sa8255p-vm-agl_overlay.dtbo \
                    sa8255p-ride/sa8255p-vm-v3-agl_overlay.dtbo \
                    sa8255p-ride/sa8255p-vm-agl_overlay_pcie_ep.dtbo \
                    sa8255p-ride/sa8255p-vm-sw-eth-phy-agl_overlay.dtbo"

# Copying dtbo list, otherwise there will ba a circular dependency chain.
OOT_VM_DTBOS_COPY := "${OOT_VM_DTBOS}"

OOT_VM_DTBOS = "${@bb.utils.contains('DISTRO_FEATURES', 'qti-qcvirtio', OOT_VM_DTBOS_AGL, OOT_VM_DTBOS_COPY, d)}"
