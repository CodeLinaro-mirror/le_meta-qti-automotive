#@TYPE: Machine
#@NAME: sa8797dc
#@DESCRIPTION: Machine configuration for QTI sa8797dc

BASEMACHINE = "sa8797dc"
include conf/machine/include/sa8797dc.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

RECOVERY_IMAGE = "0"

PREFERRED_PROVIDER_mkbootimg-native = "mkbootimg-gki-native"
PREFERRED_VERSION_mkbootimg-gki-native = "5.14"

IMAGE_FEATURES:remove = " read-only-rootfs"

EXTRA_IMAGEDEPENDS += "edk2"
CLANG_BIN="${SRC_DIR_ROOT}/prebuilts/clang/host/linux-x86/clang-r416183b/bin/"

KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0xE1E00000"
KERNEL_TAGS_OFFSET = "0xE1E00000"
KERNEL_CONFIG = "defconfig"

KERNEL_MACHINE_DTB = "\
        arch/arm64/boot/dts/qcom/sa8797dc.dtb \
        arch/arm64/boot/dts/qcom/sa8797dc-v2.dtb \
"

KERNEL_CMD_PARAMS = "rw rootwait console=ttyMSM0,115200,n8 no_console_suspend=1 root=/dev/ram init=/bin/sh androidboot.hardware=qcom androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 earlycon=qcom_geni,0x884000 fips=0 notests ignore_loglevel firmware_class.path=/firmware/vm/boot systemd.gpt_auto=0 cgroup.memory=nokmem,nosocket maxcpus=6"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=qcom_geni,0xa8c000', '', d)}"

KERNEL_IMAGETYPE = "Image"

OOT_DTBS = "\
    arch/arm64/boot/dts/qcom/sa8797p-overlay.dtbo \
"

RUSTVERSION = "1.75%"
