# Completely disable systemd-tmpfiles-clean age cleanup for /tmp.
# The device has no RTC; a forward clock jump (e.g. from a time sync service)
# would otherwise make every file in /tmp look older than the max age and get
# it removed. This overrides "q /tmp 1777 root root 10d" in tmp.conf: the
# first definition wins, and 00-keep-boot-tmp.conf sorts before tmp.conf.
q /tmp 1777 root root -
